name: build-from-zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Find and extract zip
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Repoda .zip fayl topilmadi"
            exit 1
          fi
          echo "Topildi: $ZIP"
          mkdir -p /tmp/modsrc
          unzip -q "$ZIP" -d /tmp/modsrc
          GRADLEW=$(find /tmp/modsrc -name gradlew -type f -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Zip ichida gradlew topilmadi"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Loyiha papkasi: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: firstperson-replay-ui
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
